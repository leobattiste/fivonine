name: Fivonine checks
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run start -- --port 3040 > /tmp/fivonine-server.log 2>&1 &
      - run: node tests/browser.mjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/database.sql
